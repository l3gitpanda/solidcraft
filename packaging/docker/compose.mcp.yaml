# SolidCraft in the browser, driven over MCP while you watch (docs/web-mcp.md).
# From this folder, or from anywhere with -f packaging/docker/compose.mcp.yaml:
#
#   export SOLIDCRAFT_WEB_MCP_TOKEN="$(openssl rand -hex 32)"     (or put it in a .env file here)
#   docker compose -f compose.mcp.yaml up -d
#
# That runs the image the fork's GitHub Actions build from its main after every upstream sync
# (.github/workflows/fork-image.yml): ghcr.io/l3gitpanda/solidcraft-web-mcp:latest, pulled on
# each `up`. `docker compose -f compose.mcp.yaml pull && docker compose -f compose.mcp.yaml up -d`
# moves to a newer one; so does Watchtower, if it runs on the host (the label below).
# To build the image here instead (about 20 GB of memory; docs/web-mcp.md):
#
#   SOLIDCRAFT_IMAGE=solidcraft-web-mcp:local SOLIDCRAFT_PULL_POLICY=build docker compose -f compose.mcp.yaml up -d
#
# Then open http://localhost:8080/#mcp-token=<the token> once in your browser, and point an MCP
# client at http://localhost:8080/mcp with the header `Authorization: Bearer <the token>`.
#
# SOLIDCRAFT_PORT picks the host port (default 8080). On a server, put a TLS reverse proxy in
# front of it (browsers want HTTPS for WebGPU and for saving designs); it must pass WebSocket
# upgrades for /mcp-link and must not buffer /mcp. Name its address in SOLIDCRAFT_WEB_MCP_URL,
# and in SOLIDCRAFT_WEB_MCP_ORIGINS too if it does not pass the browser's Host header through.
name: solidcraft-mcp
services:
  solidcraft:
    image: "${SOLIDCRAFT_IMAGE:-ghcr.io/l3gitpanda/solidcraft-web-mcp:latest}"
    pull_policy: "${SOLIDCRAFT_PULL_POLICY:-always}"
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.mcp
    environment:
      SOLIDCRAFT_WEB_MCP_TOKEN: "${SOLIDCRAFT_WEB_MCP_TOKEN:?set SOLIDCRAFT_WEB_MCP_TOKEN, for example to the output of: openssl rand -hex 32}"
      SOLIDCRAFT_WEB_MCP_URL: "${SOLIDCRAFT_WEB_MCP_URL:-}"
      SOLIDCRAFT_WEB_MCP_ORIGINS: "${SOLIDCRAFT_WEB_MCP_ORIGINS:-}"
    ports:
      - "${SOLIDCRAFT_PORT:-8080}:8080"
    volumes:
      # Designs, exports and pictures the agents save: paths under /data in their tool calls.
      - data:/data
    restart: unless-stopped
    labels:
      # Lets a Watchtower on this host (one started with --label-enable, or any) update it.
      com.centurylinklabs.watchtower.enable: "true"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  data:
